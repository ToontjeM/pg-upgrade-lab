networks:
  upgradenet:

services:
  # ---------------------------------------------------------------------------
  # Security: public-schema privilege escalation (CVE-2018-1058 class).
  # Identical setup on both -- see security/init.sql -- the only difference
  # is each version's *default* privileges. No persistent volume, by design:
  # every provision starts from the same clean, unescalated state.
  # ---------------------------------------------------------------------------
  pg14-security:
    image: postgres:14
    hostname: pg14-security
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./security/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [upgradenet]
    ports: ["5401:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  pg18-security:
    image: postgres:18
    hostname: pg18-security
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./security/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [upgradenet]
    ports: ["5402:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Security, second scenario: CVE-2024-0985, REFRESH MATERIALIZED VIEW
  # CONCURRENTLY privilege escalation. Deliberately a same-major, minor-
  # version-only pair (15.5 vs 15.6, fixed 2024-02-08) rather than a major
  # jump like the pair above -- the point is that minor releases matter too.
  # Verified by hand: the only known working proof of concept (the CREATE
  # RULE trick this scenario uses) escalates role r0 to superuser on 15.5
  # and fails with a clean error on 15.6, with no other difference in setup.
  # Same "no persistent volume" reasoning as the pair above.
  # ---------------------------------------------------------------------------
  pg15-5-security:
    image: postgres:15.5
    hostname: pg15-5-security
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./security/init-cve.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [upgradenet]
    ports: ["5411:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  pg15-6-security:
    image: postgres:15.6
    hostname: pg15-6-security
    environment:
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./security/init-cve.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks: [upgradenet]
    ports: ["5412:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Performance: asynchronous I/O (io_method), PG17 (sync-only) vs PG18.
  # mem_limit caps each container well below the seeded table's size so I/O
  # actually happens instead of everything living in shared_buffers/page
  # cache; shared_buffers is capped the same way on both for a fair compare.
  # ---------------------------------------------------------------------------
  pg17-performance:
    image: postgres:17
    hostname: pg17-performance
    mem_limit: 768m
    environment:
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_io_concurrency=0
      -c max_parallel_workers_per_gather=0
    networks: [upgradenet]
    ports: ["5403:5432"]
    volumes:
      - pgdata-pg17-perf:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  pg18-performance:
    image: postgres:18
    hostname: pg18-performance
    mem_limit: 768m
    environment:
      POSTGRES_PASSWORD: postgres
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_io_concurrency=0
      -c max_parallel_workers_per_gather=0
      -c io_method=worker
    networks: [upgradenet]
    ports: ["5404:5432"]
    volumes:
      - pgdata-pg18-perf:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Reliability: failover-persistent logical replication slots (PG17+),
  # PG16 (no such feature) vs PG18. Each version gets its own
  # primary + standby + logical subscriber, same topology, same publication.
  # ---------------------------------------------------------------------------
  pg16-primary:
    build:
      context: ./reliability/postgres
      args: { PG_VERSION: "16" }
    hostname: pg16-primary
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      ROLE: primary
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    networks: [upgradenet]
    ports: ["5405:5432"]
    volumes:
      - pgdata-pg16-primary:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  pg16-standby:
    build:
      context: ./reliability/postgres
      args: { PG_VERSION: "16" }
    hostname: pg16-standby
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      ROLE: standby
      PRIMARY_HOST: pg16-primary
      STANDBY_SLOT: pg16_standby_slot
    command: >
      postgres
      -c hot_standby=on
      -c hot_standby_feedback=on
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
    networks: [upgradenet]
    ports: ["5406:5432"]
    volumes:
      - pgdata-pg16-standby:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      pg16-primary:
        condition: service_healthy
    restart: unless-stopped

  pg16-subscriber:
    image: postgres:16
    hostname: pg16-subscriber
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./reliability/subscriber-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata-pg16-subscriber:/var/lib/postgresql
    networks: [upgradenet]
    ports: ["5407:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      pg16-primary:
        condition: service_healthy
    restart: unless-stopped

  pg18-primary:
    build:
      context: ./reliability/postgres
      args: { PG_VERSION: "18" }
    hostname: pg18-primary
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      ROLE: primary
    command: >
      postgres
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
      -c sync_replication_slots=on
      -c synchronized_standby_slots=pg18_standby_slot
    networks: [upgradenet]
    ports: ["5408:5432"]
    volumes:
      - pgdata-pg18-primary:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    restart: unless-stopped

  pg18-standby:
    build:
      context: ./reliability/postgres
      args: { PG_VERSION: "18" }
    hostname: pg18-standby
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
      ROLE: standby
      PRIMARY_HOST: pg18-primary
      STANDBY_SLOT: pg18_standby_slot
    command: >
      postgres
      -c hot_standby=on
      -c hot_standby_feedback=on
      -c wal_level=logical
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c sync_replication_slots=on
    networks: [upgradenet]
    ports: ["5409:5432"]
    volumes:
      - pgdata-pg18-standby:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      pg18-primary:
        condition: service_healthy
    restart: unless-stopped

  pg18-subscriber:
    image: postgres:18
    hostname: pg18-subscriber
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./reliability/subscriber-init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
      - pgdata-pg18-subscriber:/var/lib/postgresql
    networks: [upgradenet]
    ports: ["5410:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 40
    depends_on:
      pg18-primary:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  demo-app:
    build: ./webapp
    environment:
      SEC_OLD_HOST: pg14-security
      SEC_NEW_HOST: pg18-security
      CVE_OLD_HOST: pg15-5-security
      CVE_NEW_HOST: pg15-6-security
      PERF_OLD_HOST: pg17-performance
      PERF_NEW_HOST: pg18-performance
      REL_OLD_PRIMARY_HOST: pg16-primary
      REL_OLD_STANDBY_HOST: pg16-standby
      REL_OLD_SUBSCRIBER_HOST: pg16-subscriber
      REL_NEW_PRIMARY_HOST: pg18-primary
      REL_NEW_STANDBY_HOST: pg18-standby
      REL_NEW_SUBSCRIBER_HOST: pg18-subscriber
      COMPOSE_PROJECT_NAME: upgrade
      # The Reliability tab's "reset" button shells out to `docker compose`
      # itself (Docker-outside-of-Docker, over the socket below) to rebuild
      # a version's 3 containers + volumes. That means any bind-mount source
      # paths docker-compose.yml uses must resolve on the *host* daemon, not
      # inside this container -- so PROJECT_DIR is bind-mounted at the exact
      # same absolute path here as on the host (via ${PWD}, below) rather
      # than some container-local path like /project.
      PROJECT_DIR: ${PWD}
    networks: [upgradenet]
    ports: ["3000:8080"]
    volumes:
      # Lets the Reliability tab promote/reset containers and the
      # Security/Performance tabs read container state -- see webapp/server.js.
      # Grants demo-app full control of the Docker host, not just these
      # containers -- fine for this local single-user demo, never on a
      # shared or internet-facing host.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}:ro
    depends_on:
      pg14-security: { condition: service_healthy }
      pg18-security: { condition: service_healthy }
      pg15-5-security: { condition: service_healthy }
      pg15-6-security: { condition: service_healthy }
      pg17-performance: { condition: service_healthy }
      pg18-performance: { condition: service_healthy }
      pg16-subscriber: { condition: service_healthy }
      pg18-subscriber: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata-pg17-perf:
  pgdata-pg18-perf:
  pgdata-pg16-primary:
  pgdata-pg16-standby:
  pgdata-pg16-subscriber:
  pgdata-pg18-primary:
  pgdata-pg18-standby:
  pgdata-pg18-subscriber:
